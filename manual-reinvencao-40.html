:root{
  --gold:#c8a96e; --black:#0a0a0a; --bsoft:#141414; --bcard:#1a1a1a;
  --nude:#f5ede3; --white:#fafaf8; --muted:#888;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--black);color:var(--white);font-family:'Raleway',sans-serif;font-weight:300;line-height:1.7;overflow-x:hidden;}

/* STRIP */
.strip{background:var(--gold);text-align:center;padding:.55rem 1rem;font-size:.7rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#000;}

/* HERO */
.hero{position:relative;display:flex;align-items:center;justify-content:flex-start;overflow:hidden;min-height:100vh;}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;display:block;}
.hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,10,.90) 40%,rgba(10,10,10,.30) 100%);}
.hero-body{position:relative;z-index:2;padding:7rem 4rem 5rem;max-width:640px;}
.hero-eyebrow{font-size:.67rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:2rem;}
.hero-title{font-family:'Cormorant Garamond',serif;font-size:clamp(1.5rem,5.2vw,3.4rem);font-weight:300;line-height:1.25;margin-bottom:1.8rem;white-space:nowrap;}
.hero-title em{font-style:italic;color:var(--gold);}
.hero-sub{font-size:1rem;color:rgba(250,250,248,.72);line-height:1.9;margin-bottom:3rem;max-width:480px;}
.btn{display:inline-block;background:var(--gold);color:#000;font-family:'Raleway',sans-serif;font-size:.76rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;padding:1.1rem 2.8rem;transition:all .3s;}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(200,169,110,.35);}

/* SECTIONS */
section{padding:5rem 2rem;}
.wrap{max-width:900px;margin:0 auto;}
.wrap-wide{max-width:1100px;margin:0 auto;}
.slabel{font-size:.67rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);display:block;text-align:center;margin-bottom:.9rem;}
.stitle{font-family:'Cormorant Garamond',serif;font-size:clamp(1.9rem,4vw,3rem);font-weight:300;line-height:1.2;text-align:center;margin-bottom:.8rem;}
.stitle em{font-style:italic;color:var(--gold);}
.sintro{text-align:center;color:rgba(250,250,248,.62);max-width:540px;margin:0 auto 3.5rem;font-size:.95rem;line-height:1.9;}
.gold-rule{width:48px;height:1px;background:var(--gold);margin:.6rem auto 0;}

/* BOOK SECTION */
.book-section{background:var(--bsoft);border-top:1px solid rgba(200,169,110,.15);border-bottom:1px solid rgba(200,169,110,.15);}
.book-inner{display:flex;align-items:center;gap:5rem;flex-wrap:wrap;max-width:1060px;margin:0 auto;}
.book-img-wrap{flex-shrink:0;position:relative;}
.book-img-wrap img{width:clamp(220px,28vw,320px);height:auto;display:block;position:relative;z-index:1;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.book-img-wrap::before{content:'';position:absolute;top:-12px;left:-12px;right:12px;bottom:12px;border:1px solid rgba(200,169,110,.35);z-index:0;}
.book-text{flex:1;min-width:280px;}
.book-text .blabel{font-size:.67rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:1.2rem;}
.book-text h2{font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,3.5vw,2.8rem);font-weight:300;line-height:1.2;margin-bottom:1.4rem;}
.book-text h2 em{font-style:italic;color:var(--gold);}
